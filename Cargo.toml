[package]
name = "yo"
version = "1.1.65"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "A multi-functional command-line tool with GitHub SSH key management and SOCKS5 proxy"

# Shared library
[lib]
name = "yo_lib"
path = "src/lib.rs"

# Binary: GitHub SSH key management (Linux musl)
[[bin]]
name = "yo-git"
path = "src/bin/yo_git.rs"

# Binary: SOCKS5 proxy service (Linux musl)
[[bin]]
name = "yo-s5"
path = "src/bin/yo_s5.rs"

# Binary: File utilities (Linux musl)
[[bin]]
name = "yo-file"
path = "src/bin/yo_file.rs"

# Binary: OceanBase environment tool (Linux musl)
[[bin]]
name = "yo-ob"
path = "src/bin/yo_ob.rs"

# Binary: Budget-controlled AWS cost burner via S3 large-object writes (Linux)
[[bin]]
name = "yo-s3"
path = "src/bin/yo_s3.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client for API requests (use rustls instead of openssl)
reqwest = { version = "0.13", features = ["blocking", "json", "rustls", "gzip"], default-features = false }
# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Crypto dependencies (pure Rust, no OpenSSL)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
rand = { version = "0.9", features = ["small_rng"] }
base64 = "0.22"
block-padding = "0.3"
# Terminal colors
colored = "3.1.1"
# Regex support
regex = "1.11.3"
# Error handling
anyhow = "1.0"
thiserror = "2.0"
# Network utilities
socket2 = "0.6"
# System utilities
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }
# Interactive prompts
inquire = "0.9"
# Directory walking
walkdir = "2.5"
# Gitignore-aware directory walking
ignore = "0.4"
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
# Home directory detection
dirs-next = "2.0"
# --- yo-s3: AWS SDK (pure Rust, rustls) ---
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-sdk-iam = "1"
# Route table / VPC endpoint lookup: detects whether S3 traffic pays the NAT
# gateway data-processing fee ($0.045/GB), which the budget must account for.
# Costs ~155s of build time (all 1512 EC2 operations are generated and AWS does
# not gate them per operation — awslabs/aws-sdk-rust#113), but LTO strips the
# unused ones, so the shipped binary is SMALLER than hand-rolling the two calls
# over reqwest, which would link a second HTTP stack next to the SDK's.
aws-sdk-ec2 = "1"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
http-body = "1"
# Zero-copy refcounted buffers (key to the in-memory data pool)
bytes = "1"
# Unique object headers / run ids
uuid = { version = "1", features = ["v4"] }
# Progress bar
indicatif = "0.17"
# Human-friendly size / duration parsing
byte-unit = "5"
humantime = "2"
# Part latency histogram (p50/p95/p99)
hdrhistogram = "7"
# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CancellationToken for graceful shutdown
tokio-util = "0.7"
# Object-safe async trait methods (yo-s3 burn modes are dyn-dispatched)
async-trait = "0.1"

[dev-dependencies]
# Paused-clock tests for the yo-s3 rate limiter
tokio = { version = "1", features = ["full", "test-util"] }

[target.'cfg(unix)'.dependencies]
# Unix system calls. "fs" carries flock, the yo-s3 single-instance guard: the
# kernel releases it when the holder dies (kill -9 included), so there is no
# stale lock to detect and no PID-liveness heuristic to get wrong.
nix = { version = "0.29", features = ["user", "fs"] }

[profile.release]
opt-level = 3
lto = true
strip = true
